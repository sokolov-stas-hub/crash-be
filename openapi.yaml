openapi: 3.0.3

info:
  title: Crash Backend API
  version: 0.1.0
  description: |
    Real-time Crash game backend.
    Multi-tenant via the `X-API-Key` request header — auto-creates a new
    player on first request with starting balance 10,000.

    ## WebSocket events

    Connect via Socket.IO with `auth: { apiKey: '<your-key>' }`. The
    server sends `round:state` immediately on connection and again on
    every reconnect.

    ### Server → Client

    | Event | Payload |
    |---|---|
    | `round:state` | `{ phase, roundId, startedAt, endsAt, currentMultiplier, crashPoint, yourBet, players }` |
    | `round:waiting` | `{ roundId, endsAt, players: [] }` |
    | `round:start` | `{ roundId, startedAt, players }` |
    | `round:tick` | `{ roundId, multiplier, elapsedMs }` |
    | `round:crash` | `{ roundId, crashPoint, tier, players }` |
    | `bet:placed` | `{ betId, roundId, amount, autoCashOutAt, balance }` (player-targeted) |
    | `bet:cashedOut` | `{ betId, multiplier, winAmount, profit, balance }` (player-targeted) |
    | `bet:lost` | `{ betId, crashPoint, balance }` (player-targeted) |
    | `bet:rejected` | `{ reason, message }` (player-targeted) |
    | `players:bet` | `{ username, amount }` (broadcast) |
    | `players:cashout` | `{ username, multiplier, winAmount }` (broadcast) |
    | `players:lost` | `{ username, amount }` (broadcast) |

    players arrays contain PublicPlayer objects (see schemas).

    ### Client → Server

    | Event | Payload |
    |---|---|
    | `bet:place` | `{ amount: number, autoCashOutAt?: number \| null }` |
    | `bet:cashout` | `{}` |

    Reject reasons: `betting_closed`, `already_has_bet`, `no_active_bet`,
    `not_running`, `insufficient_balance`, `invalid_auto_cashout`,
    `invalid_payload`.

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: System
  - name: Player
  - name: Round

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Balance:
      type: object
      required: [balance]
      properties:
        balance: { type: number }

    RoundTier:
      type: string
      enum: [low, mid, high]
      description: |
        Color/severity classification of crashPoint:
        low (red, < 1.5×), mid (orange, 1.5–3×), high (green, ≥ 3×)

    PublicPlayer:
      type: object
      properties:
        username: { type: string, description: 'Same as the player apiKey' }
        amount: { type: number }
        status: { type: string, enum: [placed, cashed_out, lost] }
        multiplier: { type: number, nullable: true, description: 'Set only when status=cashed_out' }

    RecentRound:
      type: object
      properties:
        roundId: { type: string }
        crashPoint: { type: number }
        crashedAt: { type: string, format: date-time }
        tier: { $ref: '#/components/schemas/RoundTier' }

    RecentRounds:
      type: object
      properties:
        rounds:
          type: array
          items: { $ref: '#/components/schemas/RecentRound' }

paths:
  /api/health:
    get:
      tags: [System]
      summary: Liveness probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }

  /api/balance:
    get:
      tags: [Player]
      summary: Current balance
      security: [{ ApiKey: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }

  /api/rounds/recent:
    get:
      tags: [Round]
      summary: Recent crashed rounds
      security: [{ ApiKey: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecentRounds' }
